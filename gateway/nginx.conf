upstream auth_service    { server auth-service:8001; }
upstream events_service  { server events-service:8002; }
upstream users_service   { server users-service:8003; }
upstream social_service  { server social-service:8004; }
upstream frontend        { server frontend:3000; }

server {
    listen 80;
    client_max_body_size 20M;

    # ── Health ──────────────────────────────────────────────────────────────────
    location /health {
        return 200 '{"gateway":"ok"}';
        add_header Content-Type application/json;
    }

    # ── Auth Service ────────────────────────────────────────────────────────────
    location ~ ^/api/(auth|internal/users) {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://auth_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Events Service ──────────────────────────────────────────────────────────
    location ~ ^/api/(events|categories) {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://events_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Users Service ───────────────────────────────────────────────────────────
    location ~ ^/api/users {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://users_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Social Service ──────────────────────────────────────────────────────────
    location ~ ^/api/social {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://social_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Frontend (Next.js) ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
