name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turnup
          POSTGRES_PASSWORD: turnup
          POSTGRES_DB: turnup_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U turnup -d turnup_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Empty for the sqlite leg: the suite then uses in-memory SQLite.
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+asyncpg://turnup:turnup@localhost:5432/turnup_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Create migrations test database
        if: matrix.db == 'postgres'
        run: PGPASSWORD=turnup psql -h localhost -U turnup -d turnup_test -c 'CREATE DATABASE turnup_migrations;'
      # Includes tests/test_migrations.py: fails if a model change has no matching migration.
      - run: python -m pytest -q

  frontend:
    name: Frontend typecheck & builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Web build (standalone server)
        run: npm run build
      - name: Mobile build (Capacitor static export)
        run: npm run build:capacitor
