<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#09090B" />
  <title>You're offline · Turnup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #09090B;
      color: #FAFAFA;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      gap: 1.5rem;
    }
    .icon {
      font-size: 4rem;
      line-height: 1;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.9375rem;
      color: #A1A1AA;
      max-width: 280px;
      line-height: 1.6;
    }
    button {
      background: #F97316;
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 0.75rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:hover { background: #EA580C; }
    .brand {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.25rem;
      font-weight: 900;
      color: #F97316;
    }
  </style>
</head>
<body>
  <span class="brand">turnup 🎉</span>
  <div class="icon">📡</div>
  <h1>You're offline</h1>
  <p>Check your internet connection and try again. Previously visited events are still available.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
