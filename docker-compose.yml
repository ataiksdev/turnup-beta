version: "3.9"

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - turnup-net

x-py-env: &py-env
  SECRET_KEY: ${SECRET_KEY:-turnup-dev-secret-key-min-32-chars-xK9}
  ALGORITHM: HS256

services:
  # ── API Gateway ─────────────────────────────────────────────────────────────
  gateway:
    <<: *service-defaults
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - events-service
      - users-service
      - social-service

  # ── Auth Service ─────────────────────────────────────────────────────────────
  auth-service:
    <<: *service-defaults
    build: ./services/auth-service
    ports:
      - "8001:8001"
    environment:
      <<: *py-env
      DATABASE_URL: sqlite+aiosqlite:///./data/auth.db
    volumes:
      - auth-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Events Service ────────────────────────────────────────────────────────────
  events-service:
    <<: *service-defaults
    build: ./services/events-service
    ports:
      - "8002:8002"
    environment:
      <<: *py-env
      DATABASE_URL: sqlite+aiosqlite:///./data/events.db
      AUTH_SERVICE_URL: http://auth-service:8001
    volumes:
      - events-data:/app/data
    depends_on:
      - auth-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Users Service ─────────────────────────────────────────────────────────────
  users-service:
    <<: *service-defaults
    build: ./services/users-service
    ports:
      - "8003:8003"
    environment:
      <<: *py-env
      AUTH_SERVICE_URL: http://auth-service:8001
      EVENTS_SERVICE_URL: http://events-service:8002
      SOCIAL_SERVICE_URL: http://social-service:8004
    depends_on:
      - auth-service
      - events-service
      - social-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Social Service ────────────────────────────────────────────────────────────
  social-service:
    <<: *service-defaults
    build: ./services/social-service
    ports:
      - "8004:8004"
    environment:
      <<: *py-env
      DATABASE_URL: sqlite+aiosqlite:///./data/social.db
      AUTH_SERVICE_URL: http://auth-service:8001
      EVENTS_SERVICE_URL: http://events-service:8002
    volumes:
      - social-data:/app/data
    depends_on:
      - auth-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    <<: *service-defaults
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: production
    depends_on:
      - gateway

networks:
  turnup-net:
    driver: bridge

volumes:
  auth-data:
  events-data:
  social-data:
